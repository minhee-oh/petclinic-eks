# web — nginx(정적 파일 + was 프록시). ALB 대상 (readiness gate 가 붙는다 — 네임스페이스 라벨)
# 직접 apply 하지 않는다. scripts/70-deploy.sh 가 __IMAGE__ 를 채운다
# replicas 필드 없음 — 개수는 HPA 가 정한다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: petclinic
  labels: {app.kubernetes.io/name: petclinic, tier: web}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: petclinic, tier: web}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: petclinic, tier: web}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45   # preStop 15 + ALB 등록 해제 30 과 맞춤
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                    # nginx-unprivileged 의 nginx 사용자
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: petclinic, tier: web}
          # 같은 ReplicaSet 끼리만 센다 — 없으면 롤링 중 옛 Pod 까지 세어 새 Pod 가 한 AZ 로 몰린다 (V2 실측: web 2개 모두 2c)
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: web
          image: __IMAGE__
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 128Mi}
          # /healthz 는 nginx 자체만 본다 — was 장애가 web 재시작으로 번지지 않게
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: {seconds: 15}   # ALB 가 대상 해제를 시작할 시간 — 그동안 들어온 요청은 처리
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: petclinic
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: petclinic, tier: web}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: petclinic
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}
