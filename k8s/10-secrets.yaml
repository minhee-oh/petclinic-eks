# DB 자격 증명 — Secrets Manager → ESO → K8s Secret (값은 매니페스트·저장소에 없음)
# auth 블록 없음 = ESO 컨트롤러 자신의 자격 증명 사용 → Pod Identity(external-secrets/external-secrets → pc-role-eso)
#   pc-role-eso 정책은 pc/petclinic/* 만 읽는다. RDS master 비밀(rds!db-...)은 클러스터로 들어오지 않는다
# 형식 근거: external-secrets.io provider/aws-secrets-manager (API external-secrets.io/v1)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-sm
  namespace: petclinic
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
---
# 앱(was) 이 읽는다 — 키: username, password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db
  namespace: petclinic
spec:
  refreshInterval: 1h
  secretStoreRef: {name: aws-sm, kind: SecretStore}
  target: {name: app-db, creationPolicy: Owner}
  dataFrom:
    - extract: {key: pc/petclinic/app-db}
---
# 초기화 Job 이 읽는다 — 키: username, password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: migration-db
  namespace: petclinic
spec:
  refreshInterval: 1h
  secretStoreRef: {name: aws-sm, kind: SecretStore}
  target: {name: migration-db, creationPolicy: Owner}
  dataFrom:
    - extract: {key: pc/petclinic/migration-db}
