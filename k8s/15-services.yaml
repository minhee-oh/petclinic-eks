# Service — Deployment 보다 먼저 (web nginx 는 기동 시 'was' 이름을 찾는다)
# 직접 apply 하지 않는다. scripts/70-deploy.sh 가 __DB_HOST__ 를 채운다
apiVersion: v1
kind: Service
metadata:
  name: was
  namespace: petclinic
  labels: {app.kubernetes.io/name: petclinic, tier: was}
spec:
  selector: {app.kubernetes.io/name: petclinic, tier: was}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# ALB 대상 — TargetGroupConfiguration(40-gateway.yaml)이 ip 대상으로 바꾼다
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: petclinic
  labels: {app.kubernetes.io/name: petclinic, tier: web}
spec:
  selector: {app.kubernetes.io/name: petclinic, tier: web}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# 앱은 DB 를 'db' 라는 이름으로만 안다 → DB 를 바꿀 때(4-4 RDS Proxy) 이 한 줄만 바꾼다
# DNS CNAME 이라 RDS 장애 조치 때 IP 가 바뀌어도 따라간다 (JVM DNS 캐시 30초 — was Dockerfile)
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: petclinic
  labels: {app.kubernetes.io/name: petclinic, tier: db}
spec:
  type: ExternalName
  externalName: __DB_HOST__
