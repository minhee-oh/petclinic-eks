# 앱 네임스페이스 — 다른 매니페스트보다 먼저
#   PSS: baseline 강제, restricted 는 경고·감사만 (기획서 — 앱 이미지가 restricted 를 다 맞추는지 3일차에 경고로 확인)
#   readiness gate: Pod 생성 시점에 주입되므로 처음부터 라벨을 단다 (2-8 샘플에서 Gateway 경로 동작 확인)
apiVersion: v1
kind: Namespace
metadata:
  name: petclinic
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
